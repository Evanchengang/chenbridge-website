backend:
  name: github
  repo: Evanchengang/chenbridge-website
  branch: main

media_folder: "images"
public_folder: "/images"

site_url: https://chenbridge.com
display_url: https://chenbridge.com

collections:
  - name: "pages"
    label: "Pages"

    files:
      - file: "content/homepage.md"
        label: "Homepage"
        name: "homepage"

        fields:
          - label: "Hero Title"
            name: "hero_title"
            widget: "string"

          - label: "Hero Description"
            name: "hero_desc"
            widget: "text"

          - label: "Contact Email"
            name: "contact_email"
            widget: "string"
