<script>
fetch('articles.json')
  .then(r => r.json())
  .then(data => {
    const container = document.getElementById('insights-grid');
    container.innerHTML = data.articles.map((a, i) => {
      const delayClass = i % 3 === 0 ? 'reveal-delay-1' : (i % 3 === 1 ? 'reveal-delay-2' : 'reveal-delay-3');
      const linkStyle = a.published ? '' : ' style="opacity:0.5;cursor:not-allowed;"';
      const linkText = a.published ? '阅读全文' : '即将发布';
      return `
      <div class="insight-card reveal ${delayClass}">
        <div class="insight-tag">${a.tag}</div>
        <h3>${a.title}</h3>
        <p>${a.excerpt}</p>
        <div class="insight-date">${a.date}</div>
        <a href="${a.url}" class="read-more"${linkStyle}>${linkText}</a>
      </div>`;
    }).join('');
  })
  .catch(() => {
    document.getElementById('insights-grid').innerHTML = '<p style="text-align:center;color:var(--text-muted);">加载文章列表失败，请刷新页面重试。</p>';
  });
</script>
